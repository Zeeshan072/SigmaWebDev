<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms-lets learn it</title>
  </head>
  <body>
    <h1>Form to apply for course</h1>
    <form action="post"></form>
    <div>
      <label for="username">Enter your username</label>
      <input type="text" name="username" placeholder="enter your name" />
    </div>
    <div>
      <input type="radio" id="male" name="gender" value="male" />

      <label for="male">male</label>
      <input type="radio" name="gender" id="female" value="female" />
      <label for="female">female</label>
    </div>
    <div>
      <input type="checkbox" id="subscribe" name="subscribeee" value="yes" />
      <label for="subscribe">Subsribe to Newsletter</label>
    </div>
    <div>
      <label for="comment">Enter Your Comments</label>
      <br />
      <textarea name="comment" id="comment" rows="4" cols="50"> </textarea>
    </div>
    <div>
        <select name="fruits">
      <option value="apple">Apple</option>
      <option value="banana">Banana</option>
      <option value="cherry">Cherry</option>
</select>
    </div>
  </body>
</html>

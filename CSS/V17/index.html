<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS selectors</title>
    <style>
      /* child selector*/
      .red {
        background-color: red;
      } /* element selector*/
      /*   div{
            background-color: red;
        }*/
      #green {
        background-color: green;
      }
      /* child selector*/
      /*  div>p{
        color: blue;
        background-color: yellow;

      }*/

      /* descendent selector */
      div p {
        color: pink;
        background-color: grey;
      }
      /*universal selector */
      * {
        margin: 0;
        padding: 0;
      }
      /*pseudo selector*/
      a:visited {
        color: yellow;
      }
      a:link {
        color: green;
      }
      a:active {
        background-color: red;
      }
      a:hover {
        background-color: violet;
      }
      P:first-child {
        background-color: aqua;
      }
    </style>
  </head>
  <body>
    <main claas="one">
      <p>i am first-child</p>
      <p>i am second child</p>
    </main>
    <div class="red">
      i am a div
      <article>
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>
      </article>
    </div>
    <div id="green">i am another div</div>

    <a href="https://www.google.com ">go to google</a>
    <a href="https://www.bookmyshow.com">go to bookmyshow</a>
  </body>
</html>
